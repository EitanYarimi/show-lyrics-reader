<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Red Rock Lyrics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@500;600;700&display=swap');
  :root {
    --bg: #120d0a;
    --bg-alt: #1c1410;
    --card: rgba(28, 20, 16, 0.92);
    --text: #f8eedc;
    --muted: #e0c89a;
    --accent: #8b1c1c;
    --accent2: #e2c36a;
    --danger: #e05a5a;
    --border: #6a4630;
    --font-size: 42px;
    --banner: url("banner.jpg");
    --ui: "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
    --display: Oswald, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body {
    background: var(--bg);
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  .hero-banner {
    flex: 0 0 auto;
    width: 100%;
    background: #140e0a;
    border-bottom: 3px solid var(--accent);
  }
  .hero-banner img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1024 / 409;
    object-fit: contain;
    object-position: center;
  }
  @media (min-width: 1024px) and (orientation: landscape) {
    .hero-banner {
      height: clamp(180px, 24vw, 300px);
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      aspect-ratio: unset;
      object-fit: cover;
    }
  }

  /* ---------- Top bars ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(26,18,14,0.78);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-family: var(--display);
    font-size: 24px; margin: 0; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--text);
  }
  .topbar .sub {
    font-size: 14px; color: var(--muted); margin-top: 4px; letter-spacing: .2px;
  }
  .icon-btn {
    background: none; border: none; color: var(--text); font-size: 20px;
    padding: 8px 10px; cursor: pointer; border-radius: 8px;
  }
  .icon-btn:active { background: var(--border); }

  /* ---------- Setlist screen ---------- */
  #screen-setlist.view-home .topbar,
  #screen-setlist.view-home #setlist-items,
  #screen-setlist.view-home .bar-set { display: none; }
  #screen-setlist.view-set .hero-banner,
  #screen-setlist.view-set #set-picks,
  #screen-setlist.view-set #home-label,
  #screen-setlist.view-set .bar-home { display: none; }
  #setlist-items { flex: 1; overflow-y: auto; padding: 10px 12px 24px; }
  #screen-setlist.view-set #setlist-items {
    background-image:
      linear-gradient(180deg, rgba(12,9,7,0.88), rgba(12,9,7,0.94)),
      var(--banner);
    background-size: cover;
    background-position: center top;
  }
  #home-label {
    font-family: var(--display);
    text-align: center;
    padding: 22px 16px 14px;
    color: var(--muted);
    letter-spacing: 2px;
    font-size: 18px;
    text-transform: uppercase;
  }
  #set-picks { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }
  #set-picks:empty { display: none; }
  #set-picks .song-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px 16px;
    margin: 0 0 12px;
    gap: 16px;
  }
  #set-picks .title {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: normal;
  }
  #set-picks .btn {
    flex: none;
    padding: 16px 22px;
    font-size: 16px;
  }
  .song-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 12px; margin-bottom: 8px;
  }
  .song-row .num { color: var(--accent2); font-family: var(--display); font-size: 16px; width: 26px; text-align: center; flex-shrink:0; }
  .song-row .info {
    flex: 1; min-width: 0; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .song-row .title {
    font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    letter-spacing: 0.01em;
  }
  .song-row .artist {
    font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 1 auto; max-width: 36%; font-weight: 400;
  }
  .tempo-badge {
    font-size: 13px; font-weight: 600; font-family: var(--display);
    color: var(--accent2); background: rgba(226,195,106,0.14);
    border: 1px solid rgba(226,195,106,0.45); border-radius: 4px; padding: 3px 7px; flex-shrink: 0;
    margin-left: auto; letter-spacing: 0.5px;
  }
  .song-row .reorder { display: flex; gap: 2px; flex-shrink: 0; }
  .mini-btn {
    background: var(--bg-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 6px 9px; font-size: 14px; cursor: pointer;
  }
  .mini-btn:active { background: var(--border); }

  .bottom-bar {
    flex-shrink: 0;
    background: #140e0a;
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bottom-actions {
    display: flex; gap: 8px;
  }
  .btn {
    flex: 1; padding: 16px; border-radius: 4px; border: none; font-size: 16px; font-weight: 700;
    cursor: pointer; text-align: center;
    font-family: var(--display); letter-spacing: 1px; text-transform: uppercase;
  }
  .btn-primary { background: var(--accent); color: #f4e6cf; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn:active { opacity: .8; }

  /* ---------- Editor screen ---------- */
  #edit-body, #sets-body { flex: 1; overflow-y: auto; padding: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px; font-family: var(--display); }
  .field input, .field textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 12px; font-size: 18px; font-family: var(--ui);
  }
  .field textarea { min-height: 46vh; line-height: 1.55; resize: vertical; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* ---------- Reader screen ---------- */
  #reader-topbar { background: rgba(12,9,7,0.94); }
  #reader-scroll {
    flex: 1; overflow-y: auto; padding: 28px 22px 50vh;
    scroll-behavior: auto;
    background: #0c0907;
  }
  #reader-scroll .lyrics {
    font-size: var(--font-size); line-height: 1.5; white-space: pre-wrap;
    font-weight: 700; max-width: 920px; margin: 0 auto;
    letter-spacing: 0.015em;
    font-variant-ligatures: none;
  }
  #reader-scroll .empty-hint {
    color: var(--muted); font-size: 18px; text-align: center; margin-top: 20vh; padding: 0 20px; line-height: 1.6;
  }
  #reader-controls {
    position: sticky; bottom: 0; z-index: 10;
    background: linear-gradient(to top, #1a120e 75%, transparent);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .progress-track {
    height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 12px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; }
  .controls-row { display: flex; align-items: center; gap: 8px; }
  .play-btn {
    width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--accent);
    color: #f4e6cf; font-size: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
  }
  .nav-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%; width: 46px; height: 46px; font-size: 18px; flex-shrink: 0; cursor: pointer;
  }
  .speed-group { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .speed-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 16px; cursor: pointer; min-width: 44px;
  }
  .speed-label { font-size: 12px; color: var(--muted); min-width: 58px; text-align: center; }
  .controls-row2 { display: flex; justify-content: center; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .controls-row2 span { display: flex; align-items: center; gap: 4px; }

  #song-header { padding: 4px 20px 2px; text-align: center; }
  #song-header .t { font-size: 18px; font-weight: 700; font-family: var(--display); letter-spacing: 1px; }
  #song-header .a-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 2px; }
  #song-header .a { font-size: 14px; color: var(--muted); }
  #reader-tempo-badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    min-height: 26px; padding: 2px 10px; border-radius: 14px;
    font-size: 13px; font-weight: 700; font-family: var(--display); color: var(--accent2);
    background: rgba(212,180,90,0.12); border: 1.5px solid rgba(212,180,90,0.4);
    transition: background-color 0.04s linear, box-shadow 0.04s linear, color 0.04s linear;
  }
  #reader-tempo-badge.lit {
    background: rgba(139,28,28,0.85); box-shadow: 0 0 14px 3px rgba(139,28,28,0.7); color: #fff;
  }
  #reader-tempo-badge .dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0;
  }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= SETLIST SCREEN ================= -->
  <section id="screen-setlist" class="screen active view-home">
    <div class="hero-banner">
      <img src="banner.jpg" alt="Red Rock Southern Rock Tribute">
    </div>
    <div class="topbar">
      <div>
        <h1 id="show-title">Red Rock</h1>
        <div class="sub" id="show-sub">Choose a set</div>
      </div>
      <button class="icon-btn" onclick="addSong()" title="Add song">+</button>
    </div>
    <div id="home-label">Choose a set</div>
    <div id="set-picks"></div>
    <div id="setlist-items"></div>
    <div class="bottom-bar">
      <div class="bottom-actions bar-home">
        <button class="btn btn-secondary" onclick="openSharedSets()">Settings</button>
      </div>
      <div class="bottom-actions bar-set">
        <button class="btn btn-secondary" onclick="showHome()">Home</button>
        <button class="btn btn-primary" onclick="requestWakeLock()">Keep awake</button>
      </div>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
  </section>

  <!-- ================= SHARED SETS SCREEN ================= -->
  <section id="screen-sets" class="screen">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('setlist')">&larr; Back</button>
      <h1>Settings</h1>
      <span></span>
    </div>
    <div id="sets-body">
      <div class="field">
        <label>Load from a JSON link</label>
        <input id="json-url" type="url" placeholder="https://example.com/originals.json">
      </div>
      <div class="bottom-actions" style="padding:0 0 16px;">
        <button class="btn btn-primary" onclick="loadJsonFromInput()">Load URL</button>
      </div>
      <div class="hint" style="margin-bottom:16px;">Links below come from sets.json in the repo. Add original-song JSON URLs there to share with your band.</div>
      <div class="field">
        <label>GitHub token (saves edits back to the JSON)</label>
        <input id="github-token" type="password" placeholder="ghp_..." autocomplete="off">
      </div>
      <div class="bottom-actions" style="padding:0 0 16px;">
        <button class="btn btn-secondary" onclick="saveGithubToken()">Save token</button>
      </div>
      <div class="hint" id="token-status" style="margin-bottom:16px;"></div>
      <div class="bottom-actions" style="padding:0 0 16px;">
        <button class="btn btn-secondary" onclick="exportData()">Export</button>
        <button class="btn btn-secondary" onclick="loadBackupFile()">Load file</button>
      </div>
    </div>
  </section>

  <!-- ================= EDIT SCREEN ================= -->
  <section id="screen-edit" class="screen">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('setlist')">&larr; Back</button>
      <h1>Edit Song</h1>
      <button class="icon-btn" onclick="deleteSong()" title="Delete song" style="color:var(--danger)">&#128465;</button>
    </div>
    <div id="edit-body">
      <div class="field">
        <label>Title</label>
        <input id="edit-title" type="text" placeholder="Song title">
      </div>
      <div class="field">
        <label>Artist</label>
        <input id="edit-artist" type="text" placeholder="Artist">
      </div>
      <div class="field">
        <label>Tempo (BPM)</label>
        <input id="edit-tempo" type="number" inputmode="numeric" placeholder="e.g. 120">
      </div>
      <div class="field">
        <label>Song length (mm:ss) &mdash; used to pace auto-scroll</label>
        <input id="edit-duration" type="text" placeholder="e.g. 3:45">
      </div>
      <div class="field">
        <label>Lyrics</label>
        <textarea id="edit-lyrics" placeholder="Paste the lyrics for this song here. Leave a blank line between verses/choruses. This text stays only on this device."></textarea>
        <div class="hint">Edits are saved to this set's JSON on GitHub so your band gets the same version.</div>
      </div>
    </div>
    <div class="bottom-actions">
      <button class="btn btn-primary" onclick="saveSong()">Save</button>
    </div>
    <div class="hint" id="save-status" style="padding:0 16px 12px;"></div>
  </section>

  <!-- ================= READER SCREEN ================= -->
  <section id="screen-reader" class="screen">
    <div class="topbar" id="reader-topbar">
      <div id="song-header" style="flex:1;">
        <div class="t" id="reader-title">Song</div>
        <div class="a-line">
          <div class="a" id="reader-artist">Artist</div>
          <div id="reader-tempo-badge" style="display:none;">
            <span class="dot"></span>
            <span id="reader-tempo-number"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="reader-scroll" onclick="onReaderTap(event)"></div>
    <div id="reader-controls">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="controls-row" style="margin-bottom:10px;">
        <button class="play-btn" id="play-btn" onclick="togglePlay()">&#9654;</button>
        <div style="flex:1;"></div>
      </div>

      <div class="controls-row">
        <button class="nav-btn" onclick="prevSong()">&#9664;&#9664;</button>
        <button class="nav-btn" onclick="scrollNudge(-1)">A&uarr;</button>
        <div class="speed-group">
          <button class="speed-btn" onclick="changeSpeed(-0.1)">&minus;</button>
          <div class="speed-label" id="speed-label">1.0x</div>
          <button class="speed-btn" onclick="changeSpeed(0.1)">+</button>
        </div>
        <button class="nav-btn" onclick="scrollNudge(1)">A&darr;</button>
        <button class="nav-btn" onclick="nextSong()">&#9654;&#9654;</button>
      </div>

      <div class="controls-row2">
        <span onclick="changeFont(-2)" style="cursor:pointer;">A&minus; text</span>
        <span onclick="changeFont(2)" style="cursor:pointer;">A+ text</span>
        <span onclick="requestWakeLock()" style="cursor:pointer;">&#128268; keep awake</span>
      </div>

      <div class="bottom-actions" style="margin-top:10px;">
        <button class="btn btn-secondary" onclick="stopAndLeaveReader()">&larr; Setlist</button>
        <button class="btn btn-secondary" onclick="openEditFromReader()">&#9998; Edit Lyrics</button>
      </div>
    </div>
  </section>

</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const DEFAULT_SONGS = [
  { title: "Gimme Three Steps", artist: "Lynyrd Skynyrd", tempo: 133 },
  { title: "Sharp Dressed Man", artist: "ZZ Top", tempo: 124 },
  { title: "Fortunate Son", artist: "CCR", tempo: 132 },
  { title: "One Way Out", artist: "Allman Brothers", tempo: 122 },
  { title: "Saturday Night Special", artist: "Lynyrd Skynyrd", tempo: 120 },
  { title: "Call Me the Breeze", artist: "Lynyrd Skynyrd", tempo: 151 },
  { title: "What's Your Name", artist: "Lynyrd Skynyrd", tempo: 136 },
  { title: "Ramblin' Man", artist: "Allman Brothers", tempo: 156 },
  { title: "Can't You See", artist: "Marshall Tucker Band", tempo: 112 },
  { title: "I Was Wrong", artist: "Chris Stapleton", tempo: 146 },
  { title: "Midnight Rider", artist: "Allman Brothers", tempo: 140 },
  { title: "Black Hearted Woman", artist: "Allman Brothers", tempo: 126 },
  { title: "I Got a Hole", artist: "The Sheepdogs", tempo: 156 },
  { title: "Whipping Post", artist: "Allman Brothers", tempo: 120 },
  { title: "Sweet Home Alabama", artist: "Lynyrd Skynyrd", tempo: 98 },
].map(s => ({ ...s, duration: "", lyrics: "" }));

const STORAGE_KEY = "showLyricsReaderData_v1";
const SETTINGS_KEY = "showLyricsReaderSettings_v1";
const TOKEN_KEY = "showLyricsReaderGithubToken";
const ACTIVE_SET_KEY = "showLyricsReaderActiveSet";
const GH_REPO = "EitanYarimi/show-lyrics-reader";

function loadSongs() {
  let stored = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) stored = JSON.parse(raw);
  } catch (e) {}
  if (!stored) return DEFAULT_SONGS;
  // Backfill fields (like tempo) added after this device's data was first saved,
  // matched by title, without touching any lyrics/edits already made.
  const byTitle = {};
  DEFAULT_SONGS.forEach(s => { byTitle[s.title.toLowerCase().trim()] = s; });
  return stored.map(song => {
    const def = byTitle[(song.title || "").toLowerCase().trim()];
    if (def && (song.tempo === undefined || song.tempo === null || song.tempo === "")) {
      return { ...song, tempo: def.tempo };
    }
    return song;
  });
}
function saveSongs(syncRemote) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
  if (syncRemote) persistActiveSet();
}

function setSaveStatus(text) {
  const el = document.getElementById("save-status");
  if (el) el.textContent = text || "";
}

function repoPathFromUrl(url) {
  if (!url) return null;
  try {
    const u = new URL(url, "https://eitanyarimi.github.io/show-lyrics-reader/");
    if (u.hostname === "eitanyarimi.github.io") {
      return decodeURIComponent(u.pathname.replace(/^\/show-lyrics-reader\//, ""));
    }
    const blob = u.pathname.match(/\/show-lyrics-reader\/(?:blob\/[^/]+\/)?(.+\.json)$/);
    if (u.hostname === "github.com" && blob) return blob[1];
    const raw = u.pathname.match(/\/EitanYarimi\/show-lyrics-reader\/[^/]+\/(.+\.json)$/);
    if (u.hostname === "raw.githubusercontent.com" && raw) return raw[1];
  } catch (e) {}
  if (url.startsWith("./")) return url.slice(2);
  if (!url.includes("://")) return url.replace(/^\//, "");
  return null;
}

function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function saveGithubToken() {
  const value = (document.getElementById("github-token").value || "").trim();
  if (!value) {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById("token-status").textContent = "Token cleared. Edits will stay on this device only.";
    return;
  }
  localStorage.setItem(TOKEN_KEY, value);
  document.getElementById("token-status").textContent = "Token saved on this device. Edits will write to the JSON.";
}

function fillGithubTokenField() {
  const input = document.getElementById("github-token");
  const status = document.getElementById("token-status");
  if (!input) return;
  const token = localStorage.getItem(TOKEN_KEY) || "";
  input.value = token;
  if (status) {
    status.textContent = token
      ? "Token is saved on this device."
      : "Create a GitHub token with repo access, paste it here once, then Save token.";
  }
}

async function persistActiveSet() {
  const path = activeSet && activeSet.path;
  const token = localStorage.getItem(TOKEN_KEY) || "";
  if (!path) {
    setSaveStatus("Saved on this device. Set up a shared set to write the JSON.");
    return;
  }
  if (!token) {
    setSaveStatus("Saved on this device. Add a GitHub token in Shared sets to update the JSON.");
    return;
  }
  setSaveStatus("Saving to JSON…");
  try {
    const api = "https://api.github.com/repos/" + GH_REPO + "/contents/" + path;
    const headers = {
      Accept: "application/vnd.github+json",
      Authorization: "Bearer " + token,
    };
    const current = await fetch(api, { headers, cache: "no-store" });
    if (!current.ok) throw new Error("read " + current.status);
    const meta = await current.json();
    const body = JSON.stringify({
      message: "Update " + path + " from Red Rock reader",
      content: toBase64(JSON.stringify(songs, null, 2)),
      sha: meta.sha,
      branch: "main",
    });
    const put = await fetch(api, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, headers),
      body: body,
    });
    if (!put.ok) throw new Error("write " + put.status);
    setSaveStatus("Saved to " + path);
    const sub = document.getElementById("show-sub");
    if (sub && document.getElementById("screen-setlist").classList.contains("view-set")) {
      sub.textContent = "Saved to JSON";
    }
  } catch (e) {
    setSaveStatus("Saved on this device. Couldn't update the GitHub JSON.");
  }
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.fontSize || parsed.fontSize < 40) parsed.fontSize = 42;
      return parsed;
    }
  } catch (e) {}
  return { theme: "dark", fontSize: 42 };
}
function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

let songs = loadSongs();
let settings = loadSettings();
let currentIndex = 0;
let editingIndex = null;
let wakeLock = null;
let activeSet = null;
try { activeSet = JSON.parse(localStorage.getItem(ACTIVE_SET_KEY) || "null"); } catch (e) {}

/* ============================================================
   THEME / FONT
   ============================================================ */
function applyTheme() {
  document.body.classList.remove("light");
}
function applyFont() {
  document.documentElement.style.setProperty("--font-size", settings.fontSize + "px");
}
function changeFont(delta) {
  settings.fontSize = Math.max(18, Math.min(64, settings.fontSize + delta));
  saveSettings();
  applyFont();
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
}

/* ============================================================
   SETLIST SCREEN
   ============================================================ */
function renderSetlist() {
  const container = document.getElementById("setlist-items");
  container.innerHTML = "";
  if (document.getElementById("screen-setlist").classList.contains("view-set")) {
    document.getElementById("show-sub").textContent = songs.length + " song" + (songs.length === 1 ? "" : "s");
  }
  songs.forEach((song, i) => {
    const row = document.createElement("div");
    row.className = "song-row";
    row.innerHTML = `
      <div class="num">${i + 1}</div>
      <div class="info" onclick="openReader(${i})">
        <div class="title">${escapeHtml(song.title || "Untitled")}</div>
        <div class="artist">${escapeHtml(song.artist || "")}</div>
        ${song.tempo ? `<div class="tempo-badge">${song.tempo} BPM</div>` : ""}
      </div>
      <div class="reorder">
        <button class="mini-btn" onclick="moveSong(${i}, -1)">&#9650;</button>
        <button class="mini-btn" onclick="moveSong(${i}, 1)">&#9660;</button>
      </div>
      <div class="actions">
        <button class="mini-btn" onclick="openEdit(${i})">&#9998;</button>
      </div>
    `;
    container.appendChild(row);
  });
}
function moveSong(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= songs.length) return;
  [songs[i], songs[j]] = [songs[j], songs[i]];
  saveSongs(true);
  renderSetlist();
}
function addSong() {
  songs.push({ title: "New Song", artist: "", tempo: null, duration: "", lyrics: "" });
  saveSongs(true);
  openEdit(songs.length - 1);
}
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

/* ============================================================
   EDIT SCREEN
   ============================================================ */
function openEdit(i) {
  editingIndex = i;
  const s = songs[i];
  document.getElementById("edit-title").value = s.title || "";
  document.getElementById("edit-artist").value = s.artist || "";
  document.getElementById("edit-tempo").value = s.tempo || "";
  document.getElementById("edit-duration").value = s.duration || "";
  document.getElementById("edit-lyrics").value = s.lyrics || "";
  showScreen("edit");
}
function openEditFromReader() {
  openEdit(currentIndex);
}
function saveSong() {
  if (editingIndex === null) return;
  const tempoVal = document.getElementById("edit-tempo").value.trim();
  songs[editingIndex] = {
    title: document.getElementById("edit-title").value.trim() || "Untitled",
    artist: document.getElementById("edit-artist").value.trim(),
    tempo: tempoVal ? parseInt(tempoVal, 10) : null,
    duration: document.getElementById("edit-duration").value.trim(),
    lyrics: document.getElementById("edit-lyrics").value,
  };
  saveSongs(true);
  renderSetlist();
  showScreen("setlist");
}
function deleteSong() {
  if (editingIndex === null) return;
  if (!confirm("Delete this song from the set list?")) return;
  songs.splice(editingIndex, 1);
  saveSongs(true);
  renderSetlist();
  showScreen("setlist");
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportData() {
  const blob = new Blob([JSON.stringify(songs, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "show-lyrics-backup.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    applySongsJson(reader.result, "Set list loaded from file.");
  };
  reader.readAsText(file);
  event.target.value = "";
}

function loadBackupFile() {
  document.getElementById("import-file").click();
}

function applySongsJson(text, successMessage) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data)) {
      alert("That JSON isn't a song list.");
      return false;
    }
    songs = data;
    saveSongs();
    renderSetlist();
    if (successMessage) alert(successMessage);
    return true;
  } catch (e) {
    alert("Couldn't read that JSON.");
    return false;
  }
}

function showHome() {
  const screen = document.getElementById("screen-setlist");
  screen.classList.add("view-home");
  screen.classList.remove("view-set");
  document.getElementById("show-title").textContent = "Red Rock";
  document.getElementById("show-sub").textContent = "Choose a set";
  showScreen("setlist");
}
function showSetView(name) {
  const screen = document.getElementById("screen-setlist");
  screen.classList.remove("view-home");
  screen.classList.add("view-set");
  if (name) document.getElementById("show-title").textContent = name;
  renderSetlist();
  showScreen("setlist");
}

function resolveJsonUrl(url) {
  return new URL(url, window.location.href).href;
}

async function loadJsonFromUrl(url, name) {
  try {
    const path = repoPathFromUrl(url);
    const token = localStorage.getItem(TOKEN_KEY) || "";
    let text = null;
    if (path && token) {
      const apiRes = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/" + path, {
        headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json" },
        cache: "no-store",
      });
      if (apiRes.ok) text = await apiRes.text();
    }
    if (text == null) {
      const res = await fetch(resolveJsonUrl(url), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      text = await res.text();
    }
    if (applySongsJson(text)) {
      activeSet = { name: name || "", url: url, path: path };
      localStorage.setItem(ACTIVE_SET_KEY, JSON.stringify(activeSet));
      showSetView(name);
    }
  } catch (e) {
    alert("Couldn't load that link. It must be a public HTTPS JSON file.");
  }
}

function loadJsonFromInput() {
  const url = document.getElementById("json-url").value.trim();
  if (!url) {
    alert("Paste a JSON link first.");
    return;
  }
  loadJsonFromUrl(url);
}

function renderSetRows(container, sets) {
  container.innerHTML = "";
  if (!sets.length) {
    container.innerHTML = "<div class='hint'>No shared sets yet. Add original-song JSON links in sets.json.</div>";
    return;
  }
  sets.forEach((set, i) => {
    const name = set.name || "Untitled set";
    const url = set.url || "";
    const row = document.createElement("div");
    row.className = "song-row";
    row.innerHTML = `
      <div class="info">
        <div class="title">${escapeHtml(name)}</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" data-setup="1">Set up</button>
      </div>
    `;
    row.querySelector("[data-setup]").addEventListener("click", (e) => {
      e.stopPropagation();
      loadJsonFromUrl(url, name);
    });
    row.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      loadJsonFromUrl(url, name);
    });
    container.appendChild(row);
  });
}

async function loadSetsCatalog() {
  const picks = document.getElementById("set-picks");
  if (picks) picks.innerHTML = "<div class='hint'>Loading sets…</div>";
  try {
    const res = await fetch(resolveJsonUrl("./sets.json"), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const catalog = await res.json();
    const sets = Array.isArray(catalog) ? catalog : (catalog.sets || []);
    if (picks) renderSetRows(picks, sets);
  } catch (e) {
    if (picks) picks.innerHTML = "<div class='hint'>Couldn't load sets.</div>";
  }
}

function openSharedSets() {
  fillGithubTokenField();
  showScreen("sets");
  loadSetsCatalog();
}

/* ============================================================
   READER SCREEN
   ============================================================ */
let scrollAnim = null;
let isPlaying = false;
let speedMultiplier = 1.0;
let lastTs = null;

function parseDurationToSeconds(str) {
  if (!str) return null;
  const parts = str.split(":").map(p => parseInt(p, 10));
  if (parts.some(isNaN)) return null;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 1) return parts[0];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return null;
}

function openReader(i) {
  currentIndex = i;
  loadReaderSong();
  showScreen("reader");
}
function loadReaderSong() {
  stopScrolling();
  const s = songs[currentIndex];
  document.getElementById("reader-title").textContent = s.title || "Untitled";
  document.getElementById("reader-artist").textContent = s.artist || "";
  startMetronome(s.tempo);
  const scrollEl = document.getElementById("reader-scroll");
  if (s.lyrics && s.lyrics.trim().length > 0) {
    scrollEl.innerHTML = `<div class="lyrics">${escapeHtml(s.lyrics)}</div>`;
  } else {
    scrollEl.innerHTML = `<div class="empty-hint">No lyrics added yet for this song.<br>Tap the pencil icon above to paste them in.</div>`;
  }
  scrollEl.scrollTop = 0;
  updateProgress();
  setPlayIcon(false);
}
function stopAndLeaveReader() {
  stopScrolling();
  stopMetronome();
  releaseWakeLock();
  renderSetlist();
  showScreen("setlist");
}

/* ============================================================
   METRONOME (blinking BPM light)
   ============================================================ */
let metronomeTimer = null;
function startMetronome(tempo) {
  stopMetronome();
  const badge = document.getElementById("reader-tempo-badge");
  const numberEl = document.getElementById("reader-tempo-number");
  if (!tempo) {
    badge.style.display = "none";
    return;
  }
  numberEl.textContent = tempo + " BPM";
  badge.style.display = "inline-flex";
  const halfBeatMs = 30000 / tempo; // half of the 60000/tempo beat period
  badge.classList.add("lit");
  metronomeTimer = setInterval(() => {
    badge.classList.toggle("lit");
  }, halfBeatMs);
}
function stopMetronome() {
  if (metronomeTimer) { clearInterval(metronomeTimer); metronomeTimer = null; }
  const badge = document.getElementById("reader-tempo-badge");
  if (badge) badge.classList.remove("lit");
}
function prevSong() {
  if (currentIndex > 0) { currentIndex--; loadReaderSong(); }
}
function nextSong() {
  if (currentIndex < songs.length - 1) { currentIndex++; loadReaderSong(); }
}

function baseSpeedPxPerSec() {
  const scrollEl = document.getElementById("reader-scroll");
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const durSec = parseDurationToSeconds(songs[currentIndex].duration);
  if (durSec && durSec > 0 && maxScroll > 0) {
    return maxScroll / durSec;
  }
  return 28; // default px/sec fallback
}

function togglePlay() {
  if (isPlaying) { stopScrolling(); } else { startScrolling(); requestWakeLock(); }
}
function setPlayIcon(playing) {
  document.getElementById("play-btn").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
}
function startScrolling() {
  isPlaying = true;
  setPlayIcon(true);
  lastTs = null;
  scrollAnim = requestAnimationFrame(scrollStep);
}
function stopScrolling() {
  isPlaying = false;
  setPlayIcon(false);
  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  scrollAnim = null;
  lastTs = null;
}
function scrollStep(ts) {
  if (!isPlaying) return;
  const scrollEl = document.getElementById("reader-scroll");
  if (lastTs !== null) {
    const dt = (ts - lastTs) / 1000;
    const speed = baseSpeedPxPerSec() * speedMultiplier;
    scrollEl.scrollTop += speed * dt;
    updateProgress();
    const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
    if (scrollEl.scrollTop >= maxScroll - 2) {
      stopScrolling();
      return;
    }
  }
  lastTs = ts;
  scrollAnim = requestAnimationFrame(scrollStep);
}
function updateProgress() {
  const scrollEl = document.getElementById("reader-scroll");
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const pct = maxScroll > 0 ? Math.min(100, (scrollEl.scrollTop / maxScroll) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
}
function scrollNudge(dir) {
  const scrollEl = document.getElementById("reader-scroll");
  scrollEl.scrollTop += dir * 120;
  updateProgress();
}
function changeSpeed(delta) {
  speedMultiplier = Math.max(0.2, Math.min(3.0, +(speedMultiplier + delta).toFixed(1)));
  document.getElementById("speed-label").textContent = speedMultiplier.toFixed(1) + "x";
}
function onReaderTap(e) {
  if (isPlaying) stopScrolling();
}
document.getElementById("reader-scroll").addEventListener("scroll", updateProgress);

/* Swipe left/right to change songs on the reader */
let touchStartX = null, touchStartY = null;
document.getElementById("reader-scroll").addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById("reader-scroll").addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) {
    if (dx < 0) nextSong(); else prevSong();
  }
  touchStartX = null; touchStartY = null;
}, { passive: true });

/* Keyboard / bluetooth pedal support */
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("screen-reader").classList.contains("active")) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight" || e.code === "PageDown") { nextSong(); }
  else if (e.code === "ArrowLeft" || e.code === "PageUp") { prevSong(); }
  else if (e.code === "ArrowUp") { changeSpeed(0.1); }
  else if (e.code === "ArrowDown") { changeSpeed(-0.1); }
});

/* ============================================================
   WAKE LOCK (keep iPad screen on during the show)
   ============================================================ */
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* ignore - user gesture or support issue */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && isPlaying) {
    requestWakeLock();
  }
});

/* ============================================================
   INIT
   ============================================================ */
applyTheme();
applyFont();
renderSetlist();
loadSetsCatalog();
</script>
</body>
</html>
