<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Red Rock Lyrics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@500;600;700&display=swap');
  :root {
    --bg: #120d0a;
    --bg-alt: #1c1410;
    --card: rgba(28, 20, 16, 0.92);
    --text: #fff8ec;
    --muted: #f0d9a8;
    --accent: #8b1c1c;
    --accent2: #f0d078;
    --danger: #e05a5a;
    --border: #6a4630;
    --surface: #140e0a;
    --topbar: rgba(26, 18, 14, 0.78);
    --reader-bg: #0a0705;
    --reader-top: rgba(12, 9, 7, 0.94);
    --reader-controls: #1a120e;
    --reader-active: #ffffff;
    --setlist-scrim-top: rgba(12, 9, 7, 0.88);
    --setlist-scrim-bot: rgba(12, 9, 7, 0.94);
    --overlay: rgba(8, 5, 4, 0.88);
    --btn-on-accent: #f4e6cf;
    --font-size: 42px;
    --banner: url("banner.jpg");
    --ui: "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
    --display: Oswald, sans-serif;
  }
  body.light {
    --bg: #f7f1e8;
    --bg-alt: #ebe2d4;
    --card: #ffffff;
    --text: #0a0604;
    --muted: #2a1c14;
    --accent: #7a1212;
    --accent2: #5c4508;
    --danger: #9b1c1c;
    --border: #8a6f52;
    --surface: #efe6d8;
    --topbar: rgba(247, 241, 232, 0.97);
    --reader-bg: #ffffff;
    --reader-top: rgba(247, 241, 232, 0.98);
    --reader-controls: #efe6d8;
    --reader-active: #0a0604;
    --setlist-scrim-top: rgba(247, 241, 232, 0.92);
    --setlist-scrim-bot: rgba(247, 241, 232, 0.96);
    --overlay: rgba(247, 241, 232, 0.94);
    --btn-on-accent: #fff8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
    -ms-touch-action: manipulation;
  }
  body {
    background: var(--bg);
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  .hero-banner {
    flex: 0 0 auto;
    width: 100%;
    background: var(--surface);
    border-bottom: 3px solid var(--accent);
  }
  .hero-banner img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1024 / 409;
    object-fit: contain;
    object-position: center;
  }
  @media (min-width: 1024px) and (orientation: landscape) {
    .hero-banner {
      height: clamp(180px, 24vw, 300px);
      margin: 0;
      padding: 0;
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      aspect-ratio: unset;
      object-fit: cover;
      object-position: top center;
    }
  }

  /* ---------- Top bars ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: var(--topbar);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-family: var(--display);
    font-size: 24px; margin: 0; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--text);
  }
  .topbar .sub {
    font-size: 14px; color: var(--muted); margin-top: 4px; letter-spacing: .2px;
  }
  .icon-btn {
    background: none; border: none; color: var(--text); font-size: 20px;
    padding: 8px 10px; cursor: pointer; border-radius: 8px;
  }
  .icon-btn:active { background: var(--border); }

  /* ---------- Setlist screen ---------- */
  #screen-setlist.view-home {
    padding-top: 0;
  }
  #screen-setlist.view-home .hero-banner {
    margin-top: 0;
  }
  #screen-setlist.view-home .topbar,
  #screen-setlist.view-home #setlist-items,
  #screen-setlist.view-home .bar-set { display: none; }
  #screen-setlist.view-set .hero-banner,
  #screen-setlist.view-set #set-picks,
  #screen-setlist.view-set #home-label,
  #screen-setlist.view-set .bar-home { display: none; }
  #setlist-items { flex: 1; overflow-y: auto; padding: 10px 12px 24px; }
  #screen-setlist.view-set #setlist-items {
    background-image:
      linear-gradient(180deg, var(--setlist-scrim-top), var(--setlist-scrim-bot)),
      var(--banner);
    background-size: cover;
    background-position: center top;
  }
  #home-label {
    font-family: var(--display);
    text-align: center;
    padding: 22px 16px 14px;
    color: var(--muted);
    letter-spacing: 2px;
    font-size: 18px;
    text-transform: uppercase;
  }
  #set-picks { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }
  #set-picks:empty { display: none; }
  #set-picks .song-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px 16px;
    margin: 0 0 12px;
    gap: 16px;
  }
  #set-picks .title {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: normal;
  }
  #set-picks .btn {
    flex: none;
    padding: 16px 22px;
    font-size: 16px;
  }
  .song-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 12px; margin-bottom: 8px;
  }
  .song-row .num { color: var(--accent2); font-family: var(--display); font-size: 16px; width: 26px; text-align: center; flex-shrink:0; }
  .song-row .info {
    flex: 1; min-width: 0; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .song-row .title {
    font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    letter-spacing: 0.01em;
  }
  .song-row .artist {
    font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 1 auto; max-width: 36%; font-weight: 400;
  }
  .tempo-badge {
    font-size: 13px; font-weight: 600; font-family: var(--display);
    color: var(--accent2); background: color-mix(in srgb, var(--accent2) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent2) 50%, transparent); border-radius: 4px; padding: 3px 7px; flex-shrink: 0;
    margin-left: auto; letter-spacing: 0.5px;
  }
  .song-row .reorder { display: flex; gap: 2px; flex-shrink: 0; }
  .mini-btn {
    background: var(--bg-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 6px 9px; font-size: 14px; cursor: pointer;
  }
  .mini-btn:active { background: var(--border); }

  .bottom-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bottom-actions {
    display: flex; gap: 8px;
  }
  .btn {
    flex: 1; padding: 16px; border-radius: 4px; border: none; font-size: 16px; font-weight: 700;
    cursor: pointer; text-align: center;
    font-family: var(--display); letter-spacing: 1px; text-transform: uppercase;
  }
  .btn-primary { background: var(--accent); color: var(--btn-on-accent); }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn:active { opacity: .8; }

  /* ---------- Editor screen ---------- */
  #edit-body, #sets-body { flex: 1; overflow-y: auto; padding: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px; font-family: var(--display); }
  .field input, .field textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 12px; font-size: 18px; font-family: var(--ui);
  }
  .field textarea { min-height: 46vh; line-height: 1.55; resize: vertical; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* ---------- Reader screen ---------- */
  #reader-topbar { background: var(--reader-top); }
  #reader-scroll {
    flex: 1; overflow-y: auto; padding: 28px 22px 55vh;
    scroll-behavior: auto;
    background: var(--reader-bg);
    -webkit-overflow-scrolling: touch;
  }
  #reader-scroll .lyrics {
    font-size: var(--font-size); line-height: 1.45; white-space: pre-wrap;
    font-weight: 700; max-width: 920px; margin: 0 auto;
    letter-spacing: 0.015em;
    font-variant-ligatures: none;
    color: var(--text);
  }
  #reader-scroll .empty-hint {
    color: var(--muted); font-size: 18px; text-align: center; margin-top: 20vh; padding: 0 20px; line-height: 1.6;
  }
  #reader-controls {
    position: sticky; bottom: 0; z-index: 10;
    background: linear-gradient(to top, var(--reader-controls) 75%, transparent);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .progress-track {
    height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 12px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
  }
  .controls-mid {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex: 1;
  }
  .play-btn {
    width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--accent);
    color: var(--btn-on-accent); font-size: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
    transition: background-color 0.04s linear, box-shadow 0.04s linear, transform 0.04s linear;
  }
  .play-btn.lit {
    background: #c62828;
    box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.35), 0 0 18px 4px rgba(139, 28, 28, 0.55);
    transform: scale(1.04);
  }
  body.light .play-btn.lit {
    background: #a11616;
    box-shadow: 0 0 0 3px rgba(161, 22, 22, 0.28), 0 0 14px 3px rgba(139, 28, 28, 0.35);
  }
  .nav-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%; width: 46px; height: 46px; font-size: 18px; flex-shrink: 0; cursor: pointer;
  }
  .speed-group { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .speed-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 16px; cursor: pointer; min-width: 44px;
  }
  .speed-label { font-size: 12px; color: var(--muted); min-width: 58px; text-align: center; }
  .controls-row2 { display: flex; justify-content: center; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .controls-row2 span { display: flex; align-items: center; gap: 4px; }

  #song-header { padding: 4px 12px 2px; text-align: center; min-width: 0; }
  #song-header .title-line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
    min-width: 0;
    max-width: 100%;
  }
  #song-header .t {
    font-size: 24px;
    font-weight: 700;
    font-family: var(--display);
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.15;
    min-width: 0;
    flex: 0 1 auto;
  }
  #song-header .a {
    font-size: 15px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
    min-width: 0;
    max-width: 42%;
  }
  #song-header .a:empty { display: none; }
  #song-header.title-flash .t {
    color: var(--accent);
    text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
    animation: titlePulse 0.7s ease-in-out infinite;
  }
  #song-header.title-flash .a {
    color: var(--accent2);
    animation: titlePulse 0.7s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.72; transform: scale(1.03); }
  }
  .play-btn.counting {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0;
    background: #c62828;
    box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.35), 0 0 18px 4px rgba(139, 28, 28, 0.45);
  }
  body.light .play-btn.counting {
    background: #a11616;
  }
  #reader-tempo-badge {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
    min-height: 32px;
    padding: 4px 12px;
    margin-right: 4px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--display);
    letter-spacing: 0.6px;
    color: var(--accent2);
    background: color-mix(in srgb, var(--accent2) 14%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--accent2) 45%, transparent);
  }
  #reader-tempo-badge .dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0;
  }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= SETLIST SCREEN ================= -->
  <section id="screen-setlist" class="screen active view-home">
    <div class="hero-banner">
      <img src="banner.jpg" alt="Red Rock Southern Rock Tribute">
    </div>
    <div class="topbar">
      <div>
        <h1 id="show-title">Red Rock</h1>
        <div class="sub" id="show-sub">Choose a set</div>
      </div>
      <button class="icon-btn" onclick="addSong()" title="Add song">+</button>
    </div>
    <div id="home-label">Choose a set</div>
    <div id="set-picks"></div>
    <div id="setlist-items"></div>
    <div class="bottom-bar">
      <div class="bottom-actions bar-home">
        <button class="btn btn-secondary" id="theme-btn" onclick="toggleTheme()">Light</button>
        <button class="btn btn-secondary" onclick="openSharedSets()">Settings</button>
      </div>
      <div class="bottom-actions bar-set">
        <button class="btn btn-secondary" onclick="showHome()">Home</button>
        <button class="btn btn-secondary" onclick="exportData()">Export</button>
        <button class="btn btn-primary" onclick="requestWakeLock()">Keep awake</button>
      </div>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
  </section>

  <!-- ================= SHARED SETS SCREEN ================= -->
  <section id="screen-sets" class="screen">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('setlist')">&larr; Back</button>
      <h1>Settings</h1>
      <span></span>
    </div>
    <div id="sets-body">
      <div class="field">
        <label>Load from a JSON link</label>
        <input id="json-url" type="url" placeholder="https://example.com/originals.json">
      </div>
      <div class="bottom-actions" style="padding:0 0 16px;">
        <button class="btn btn-primary" onclick="loadJsonFromInput()">Load URL</button>
      </div>
      <div class="hint" style="margin-bottom:16px;">Links below come from sets.json in the repo. Add original-song JSON URLs there to share with your band.</div>
      <div class="field">
        <label>GitHub token (saves edits back to the JSON)</label>
        <input id="github-token" type="password" placeholder="ghp_..." autocomplete="off">
      </div>
      <div class="bottom-actions" style="padding:0 0 16px;">
        <button class="btn btn-secondary" onclick="saveGithubToken()">Save token</button>
      </div>
      <div class="hint" id="token-status" style="margin-bottom:16px;"></div>
      <div class="bottom-actions" style="padding:0 0 16px;">
        <button class="btn btn-secondary" onclick="exportData()">Export</button>
        <button class="btn btn-secondary" onclick="loadBackupFile()">Load file</button>
      </div>
    </div>
  </section>

  <!-- ================= EDIT SCREEN ================= -->
  <section id="screen-edit" class="screen">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('setlist')">&larr; Back</button>
      <h1>Edit Song</h1>
      <button class="icon-btn" onclick="deleteSong()" title="Delete song" style="color:var(--danger)">&#128465;</button>
    </div>
    <div id="edit-body">
      <div class="field">
        <label>Title</label>
        <input id="edit-title" type="text" placeholder="Song title">
      </div>
      <div class="field">
        <label>Artist</label>
        <input id="edit-artist" type="text" placeholder="Artist">
      </div>
      <div class="field">
        <label>Tempo (BPM)</label>
        <input id="edit-tempo" type="number" inputmode="numeric" placeholder="e.g. 120">
      </div>
      <div class="field">
        <label>Song length (mm:ss) &mdash; used to pace auto-scroll</label>
        <input id="edit-duration" type="text" placeholder="e.g. 3:45">
      </div>
      <div class="field">
        <label>Lyrics</label>
        <textarea id="edit-lyrics" placeholder="Paste the lyrics for this song here. Leave a blank line between verses/choruses. This text stays only on this device."></textarea>
        <div class="hint">Edits are saved to this set's JSON on GitHub so your band gets the same version.</div>
      </div>
    </div>
    <div class="bottom-actions">
      <button class="btn btn-primary" onclick="saveSong()">Save</button>
    </div>
    <div class="hint" id="save-status" style="padding:0 16px 12px;"></div>
  </section>

  <!-- ================= READER SCREEN ================= -->
  <section id="screen-reader" class="screen" style="position:relative;">
    <div class="topbar" id="reader-topbar">
      <button class="icon-btn" onclick="stopAndLeaveReader()">&larr;</button>
      <div id="song-header" style="flex:1;">
        <div class="title-line">
          <div class="t" id="reader-title">Song</div>
          <div class="a" id="reader-artist">Artist</div>
        </div>
      </div>
      <div id="reader-tempo-badge" style="display:none;">
        <span class="dot"></span>
        <span id="reader-tempo-number"></span>
      </div>
      <button class="icon-btn" onclick="openEditFromReader()" title="Edit">&#9998;</button>
    </div>
    <div id="reader-scroll" onclick="onReaderTap(event)"></div>
    <div id="reader-controls">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="controls-row">
        <button class="nav-btn" onclick="prevSong()" title="Previous">&#9664;&#9664;</button>
        <div class="controls-mid">
          <button class="speed-btn" onclick="changeFont(-2)">A&minus;</button>
          <button class="play-btn" id="play-btn" onclick="togglePlay()">&#9654;</button>
          <button class="speed-btn" onclick="changeFont(2)">A+</button>
        </div>
        <button class="nav-btn" onclick="nextSong()" title="Next">&#9654;&#9654;</button>
      </div>
      <div class="speed-label" id="speed-label" style="display:none">1.0x</div>
    </div>
  </section>

</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const DEFAULT_SONGS = [
  { title: "Gimme Three Steps", artist: "Lynyrd Skynyrd", tempo: 133 },
  { title: "Sharp Dressed Man", artist: "ZZ Top", tempo: 124 },
  { title: "Fortunate Son", artist: "CCR", tempo: 132 },
  { title: "One Way Out", artist: "Allman Brothers", tempo: 122 },
  { title: "Saturday Night Special", artist: "Lynyrd Skynyrd", tempo: 120 },
  { title: "Call Me the Breeze", artist: "Lynyrd Skynyrd", tempo: 151 },
  { title: "What's Your Name", artist: "Lynyrd Skynyrd", tempo: 136 },
  { title: "Ramblin' Man", artist: "Allman Brothers", tempo: 156 },
  { title: "Can't You See", artist: "Marshall Tucker Band", tempo: 112 },
  { title: "I Was Wrong", artist: "Chris Stapleton", tempo: 146 },
  { title: "Midnight Rider", artist: "Allman Brothers", tempo: 140 },
  { title: "Black Hearted Woman", artist: "Allman Brothers", tempo: 126 },
  { title: "I Got a Hole", artist: "The Sheepdogs", tempo: 156 },
  { title: "Whipping Post", artist: "Allman Brothers", tempo: 120 },
  { title: "Sweet Home Alabama", artist: "Lynyrd Skynyrd", tempo: 98 },
].map(s => ({ ...s, duration: "", lyrics: "" }));

const STORAGE_KEY = "showLyricsReaderData_v1";
const SETTINGS_KEY = "showLyricsReaderSettings_v1";
const TOKEN_KEY = "showLyricsReaderGithubToken";
const ACTIVE_SET_KEY = "showLyricsReaderActiveSet";
const GH_REPO = "EitanYarimi/show-lyrics-reader";

function loadSongs() {
  let stored = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) stored = JSON.parse(raw);
  } catch (e) {}
  if (!stored) return DEFAULT_SONGS;
  // Backfill fields (like tempo) added after this device's data was first saved,
  // matched by title, without touching any lyrics/edits already made.
  const byTitle = {};
  DEFAULT_SONGS.forEach(s => { byTitle[s.title.toLowerCase().trim()] = s; });
  return stored.map(song => {
    const def = byTitle[(song.title || "").toLowerCase().trim()];
    if (def && (song.tempo === undefined || song.tempo === null || song.tempo === "")) {
      return { ...song, tempo: def.tempo };
    }
    return song;
  });
}
function saveSongs(syncRemote) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
  if (syncRemote) persistActiveSet();
}

function setSaveStatus(text) {
  const el = document.getElementById("save-status");
  if (el) el.textContent = text || "";
}

function repoPathFromUrl(url) {
  if (!url) return null;
  try {
    const u = new URL(url, "https://eitanyarimi.github.io/show-lyrics-reader/");
    if (u.hostname === "eitanyarimi.github.io") {
      return decodeURIComponent(u.pathname.replace(/^\/show-lyrics-reader\//, ""));
    }
    const blob = u.pathname.match(/\/show-lyrics-reader\/(?:blob\/[^/]+\/)?(.+\.json)$/);
    if (u.hostname === "github.com" && blob) return blob[1];
    const raw = u.pathname.match(/\/EitanYarimi\/show-lyrics-reader\/[^/]+\/(.+\.json)$/);
    if (u.hostname === "raw.githubusercontent.com" && raw) return raw[1];
  } catch (e) {}
  if (url.startsWith("./")) return url.slice(2);
  if (!url.includes("://")) return url.replace(/^\//, "");
  return null;
}

function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

async function persistActiveSet() {
  const path = activeSet && activeSet.path;
  const token = localStorage.getItem(TOKEN_KEY) || "";
  if (!path) {
    setSaveStatus("Saved on this device. Set up a shared set to write the JSON.");
    return;
  }
  if (!token) {
    setSaveStatus("Saved on this device. Add a GitHub token in Shared sets to update the JSON.");
    return;
  }
  setSaveStatus("Saving to JSON…");
  try {
    const api = "https://api.github.com/repos/" + GH_REPO + "/contents/" + path;
    const headers = {
      Accept: "application/vnd.github+json",
      Authorization: "Bearer " + token,
    };
    const current = await fetch(api, { headers, cache: "no-store" });
    if (!current.ok) throw new Error("read " + current.status);
    const meta = await current.json();
    const body = JSON.stringify({
      message: "Update " + path + " from Red Rock reader",
      content: toBase64(JSON.stringify(songs, null, 2)),
      sha: meta.sha,
      branch: "main",
    });
    const put = await fetch(api, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, headers),
      body: body,
    });
    if (!put.ok) throw new Error("write " + put.status);
    setSaveStatus("Saved to " + path);
    const sub = document.getElementById("show-sub");
    if (sub && document.getElementById("screen-setlist").classList.contains("view-set")) {
      sub.textContent = "Saved to JSON";
    }
  } catch (e) {
    setSaveStatus("Saved on this device. Couldn't update the GitHub JSON.");
  }
}

      if (parsed.theme !== "light" && parsed.theme !== "dark") parsed.theme = "dark";
      return parsed;
    }
  } catch (e) {}
  return { theme: "dark", fontSize: 42 };
}

async function loadJsonFromUrl(url, name) {
  try {
    const path = repoPathFromUrl(url);
    const token = localStorage.getItem(TOKEN_KEY) || "";
    let text = null;
    if (path && token) {
      const apiRes = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/" + path, {
        headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json" },
        cache: "no-store",
      });
      if (apiRes.ok) text = await apiRes.text();
    }
    if (text == null) {
      const res = await fetch(resolveJsonUrl(url), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      text = await res.text();
    }
    if (applySongsJson(text)) {
      activeSet = { name: name || "", url: url, path: path };
      localStorage.setItem(ACTIVE_SET_KEY, JSON.stringify(activeSet));
      showSetView(name);
    }
  } catch (e) {
    alert("Couldn't load that link. It must be a public HTTPS JSON file.");
  }
}

let scrollAnim = null;
let isPlaying = false;
let speedMultiplier = 1.0;
let lastTs = null;
let userHoldingScroll = false;
let scrollPos = 0;

function parseDurationToSeconds(str) {
  if (!str) return null;
  const parts = String(str).trim().split(":").map(p => parseInt(p, 10));
  if (!parts.length || parts.some(isNaN)) return null;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 1) return parts[0];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return null;
}

function openReader(i) {
  currentIndex = i;
  loadReaderSong({ autoPlayDelay: 10 });
  showScreen("reader");
}
function loadReaderSong(opts) {
  const autoPlayDelay = opts && opts.autoPlayDelay != null ? opts.autoPlayDelay : 10;
  cancelSongCountdown();
  cancelIntroCountdown();
  stopScrolling();
  const s = songs[currentIndex] || {};
  document.getElementById("reader-title").textContent = s.title || "Untitled";
  document.getElementById("reader-artist").textContent = s.artist || "";
  updateTempoBadge(s.tempo);
  stopMetronome();
  const scrollEl = document.getElementById("reader-scroll");
  if (s.lyrics && s.lyrics.trim().length > 0) {
    scrollEl.innerHTML = `<div class="lyrics">${escapeHtml(s.lyrics)}</div>`;
  } else {
    scrollEl.innerHTML = `<div class="empty-hint">No lyrics added yet for this song.<br>Tap the pencil icon above to paste them in.</div>`;
  }
  scrollEl.scrollTop = 0;
  scrollPos = 0;
  updateProgress();
  setPlayIcon(false);
  if (autoPlayDelay > 0) scheduleAutoPlay(autoPlayDelay);
}
function stopAndLeaveReader() {
  cancelSongCountdown();
  cancelIntroCountdown();
  stopScrolling();
  stopMetronome();
  releaseWakeLock();

/* ============================================================
   METRONOME (play button flashes with BPM only while playing)
   ============================================================ */
let metronomeTimer = null;
function updateTempoBadge(tempo) {
  const badge = document.getElementById("reader-tempo-badge");
  const numberEl = document.getElementById("reader-tempo-number");
  if (!tempo) {
    badge.style.display = "none";
    return;
  }
  numberEl.textContent = "BPM: " + tempo;
  badge.style.display = "inline-flex";
}
function startMetronome(tempo) {
  stopMetronome();
  updateTempoBadge(tempo);
  const playBtn = document.getElementById("play-btn");
  if (!tempo || !playBtn || playBtn.classList.contains("counting")) return;
  const halfBeatMs = 30000 / tempo;
  playBtn.classList.add("lit");
  metronomeTimer = setInterval(() => {
    playBtn.classList.toggle("lit");
  }, halfBeatMs);
}
function stopMetronome() {
  if (metronomeTimer) { clearInterval(metronomeTimer); metronomeTimer = null; }
  const playBtn = document.getElementById("play-btn");
  if (playBtn && !playBtn.classList.contains("counting")) playBtn.classList.remove("lit");
}

let songCountdownTimer = null;
let songCountdownLeft = 0;
let songCountdownTarget = null;
let introTimer = null;
let introLeft = 0;

function setTitleFlash(on) {
  const header = document.getElementById("song-header");
  if (header) header.classList.toggle("title-flash", !!on);
}
function setPlayCountdownNumber(n) {
  const btn = document.getElementById("play-btn");
  if (!btn) return;
  btn.classList.add("counting");
  btn.classList.remove("lit");
  btn.textContent = String(n);
}
function clearPlayCountdownLook() {
  const btn = document.getElementById("play-btn");
  if (!btn) return;
  btn.classList.remove("counting");
  if (!isPlaying) setPlayIcon(false);
}

function cancelIntroCountdown() {
  if (introTimer) {
    clearInterval(introTimer);
    introTimer = null;
  }
  introLeft = 0;
  if (songCountdownTarget == null) {
    setTitleFlash(false);
    clearPlayCountdownLook();
  }
}

function scheduleAutoPlay(seconds) {
  cancelIntroCountdown();
  const scrollEl = document.getElementById("reader-scroll");
  if (!scrollEl || !scrollEl.querySelector(".lyrics")) {
    setPlayIcon(false);
    return;
  }
  introLeft = seconds;
  setTitleFlash(true);
  setPlayCountdownNumber(introLeft);
  introTimer = setInterval(() => {
    introLeft -= 1;
    if (introLeft <= 0) {
      cancelIntroCountdown();
      startScrolling();
      requestWakeLock();
      return;
    }
    setPlayCountdownNumber(introLeft);
  }, 1000);
}

function cancelSongCountdown() {
  if (songCountdownTimer) {
    clearInterval(songCountdownTimer);
    songCountdownTimer = null;
  }
  songCountdownLeft = 0;
  songCountdownTarget = null;
  if (introLeft <= 0) {
    setTitleFlash(false);
    clearPlayCountdownLook();
  }
}

function finishSongCountdown() {
  const target = songCountdownTarget;
  cancelSongCountdown();
  if (target == null || target < 0 || target >= songs.length) return;
  currentIndex = target;
  loadReaderSong({ autoPlayDelay: 10 });
}

function startSongCountdown(targetIndex) {
  if (targetIndex < 0 || targetIndex >= songs.length || targetIndex === currentIndex) return;
  stopScrolling();
  cancelIntroCountdown();
  cancelSongCountdown();
  const next = songs[targetIndex] || {};
  songCountdownTarget = targetIndex;
  songCountdownLeft = 5;
  document.getElementById("reader-title").textContent = next.title || "Untitled";
  document.getElementById("reader-artist").textContent = next.artist || "";
  updateTempoBadge(next.tempo);
  setTitleFlash(true);
  setPlayCountdownNumber(songCountdownLeft);
  songCountdownTimer = setInterval(() => {
    songCountdownLeft -= 1;
    if (songCountdownLeft <= 0) {
      finishSongCountdown();
      return;
    }
    setPlayCountdownNumber(songCountdownLeft);
  }, 1000);
}

function prevSong() {
  if (currentIndex > 0) startSongCountdown(currentIndex - 1);
}
function nextSong() {
  if (currentIndex < songs.length - 1) startSongCountdown(currentIndex + 1);
}

function scrollSpeedPxPerSec(song, scrollEl) {
  const maxScroll = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
  const durSec = parseDurationToSeconds(song.duration);
  if (durSec && durSec > 0 && maxScroll > 0) return Math.max(8, maxScroll / durSec);
  const tempo = Number(song.tempo) || 120;
  const lineH = (settings.fontSize || 42) * 1.45;
  return Math.max(12, (tempo / 60) * lineH);
}

function togglePlay() {
  if (songCountdownTarget != null) {
    // Skip ahead to the pending song and start its intro, or play now.
    const target = songCountdownTarget;
    cancelSongCountdown();
    currentIndex = target;
    loadReaderSong({ autoPlayDelay: 0 });
    startScrolling();
    requestWakeLock();
    return;
  }
  if (introLeft > 0) {
    cancelIntroCountdown();
    startScrolling();
    requestWakeLock();
    return;
  }
  if (isPlaying) { stopScrolling(); } else { startScrolling(); requestWakeLock(); }
}
function setPlayIcon(playing) {
  const btn = document.getElementById("play-btn");
  if (!btn || btn.classList.contains("counting")) return;
  btn.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
}
function startScrolling() {
  const scrollEl = document.getElementById("reader-scroll");
  if (!scrollEl || !scrollEl.querySelector(".lyrics")) return;
  cancelIntroCountdown();
  isPlaying = true;
  userHoldingScroll = false;
  const btn = document.getElementById("play-btn");
  if (btn) btn.classList.remove("counting");
  setPlayIcon(true);
  lastTs = null;
  scrollPos = scrollEl.scrollTop;
  const song = songs[currentIndex] || {};
  startMetronome(song.tempo);
  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  scrollAnim = requestAnimationFrame(scrollStep);
}
function stopScrolling() {
  isPlaying = false;
  const btn = document.getElementById("play-btn");
  if (btn) btn.classList.remove("counting");
  setPlayIcon(false);
  stopMetronome();
  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  scrollAnim = null;
  lastTs = null;
  userHoldingScroll = false;
}
function scrollStep(ts) {
  if (!isPlaying) return;
  const scrollEl = document.getElementById("reader-scroll");
  if (!scrollEl) { stopScrolling(); return; }

  if (userHoldingScroll) {
    scrollPos = scrollEl.scrollTop;
    lastTs = null;
    scrollAnim = requestAnimationFrame(scrollStep);
    return;
  }

  const song = songs[currentIndex] || {};
  const dt = lastTs == null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;

  const maxScroll = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
  if (maxScroll <= 0) {
    scrollAnim = requestAnimationFrame(scrollStep);
    return;
  }

  if (dt > 0) {
    scrollPos = Math.min(maxScroll, scrollPos + scrollSpeedPxPerSec(song, scrollEl) * speedMultiplier * dt);
    scrollEl.scrollTop = scrollPos;
    updateProgress();
    if (scrollPos >= maxScroll - 0.5) {
      scrollEl.scrollTop = maxScroll;
      updateProgress();
      stopScrolling();
      return;
    }
  }

  scrollAnim = requestAnimationFrame(scrollStep);
}
function updateProgress() {
  const scrollEl = document.getElementById("reader-scroll");
  const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
  const pct = maxScroll > 0 ? Math.min(100, (scrollEl.scrollTop / maxScroll) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
}
function scrollNudge(dir) {
  const scrollEl = document.getElementById("reader-scroll");
  scrollEl.scrollTop += dir * 120;
  scrollPos = scrollEl.scrollTop;
  updateProgress();
}
function changeSpeed(delta) {
  speedMultiplier = Math.max(0.2, Math.min(3.0, +(speedMultiplier + delta).toFixed(1)));
  document.getElementById("speed-label").textContent = speedMultiplier.toFixed(1) + "x";
}
function onReaderTap(e) {
  /* Keep play running; use the play button to pause. Manual scroll continues from here. */
}

const readerScrollEl = document.getElementById("reader-scroll");
readerScrollEl.addEventListener("scroll", () => {
  if (userHoldingScroll || !isPlaying) scrollPos = readerScrollEl.scrollTop;
  updateProgress();
});
function pauseAutoForUserScroll() {
  if (!isPlaying) return;
  userHoldingScroll = true;
  scrollPos = readerScrollEl.scrollTop;
  lastTs = null;
}
function resumeAutoAfterUserScroll() {
  if (!userHoldingScroll) return;
  userHoldingScroll = false;
  scrollPos = readerScrollEl.scrollTop;
  lastTs = null;
}
readerScrollEl.addEventListener("touchstart", pauseAutoForUserScroll, { passive: true });
readerScrollEl.addEventListener("touchend", resumeAutoAfterUserScroll, { passive: true });
readerScrollEl.addEventListener("touchcancel", resumeAutoAfterUserScroll, { passive: true });
readerScrollEl.addEventListener("mousedown", pauseAutoForUserScroll);
window.addEventListener("mouseup", resumeAutoAfterUserScroll);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") resumeAutoAfterUserScroll();
});
readerScrollEl.addEventListener("wheel", () => {
  pauseAutoForUserScroll();
  clearTimeout(readerScrollEl._wheelResume);
  readerScrollEl._wheelResume = setTimeout(resumeAutoAfterUserScroll, 180);
}, { passive: true });

/* Swipe left/right to change songs on the reader */
let touchStartX = null, touchStartY = null;
readerScrollEl.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
readerScrollEl.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) {
    if (dx < 0) nextSong(); else prevSong();
  }
  touchStartX = null; touchStartY = null;
}, { passive: true });

/* Keyboard / bluetooth pedal support */
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("screen-reader").classList.contains("active")) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight" || e.code === "PageDown") { nextSong(); }
  else if (e.code === "ArrowLeft" || e.code === "PageUp") { prevSong(); }
  else if (e.code === "ArrowUp") { changeSpeed(0.1); }
  else if (e.code === "ArrowDown") { changeSpeed(-0.1); }
});

/* ============================================================
   WAKE LOCK (keep iPad screen on during the show)
   ============================================================ */
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* ignore - user gesture or support issue */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && isPlaying) {
    requestWakeLock();
  }
});

/* ============================================================
   INIT
   ============================================================ */
applyTheme();
applyFont();
renderSetlist();
loadSetsCatalog();

/* Block browser zoom (pinch / ctrl+scroll / ctrl+/-). App A+/A- still works. */
document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gestureend", (e) => e.preventDefault(), { passive: false });
document.addEventListener("wheel", (e) => {
  if (e.ctrlKey || e.metaKey) e.preventDefault();
}, { passive: false });
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const key = e.key;
  if (key === "+" || key === "-" || key === "=" || key === "_" || key === "0") {
    e.preventDefault();
  }
}, { passive: false });
</script>
